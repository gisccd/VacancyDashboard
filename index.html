<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Available Retail Space | Center City District</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ArcGIS Maps SDK for JavaScript -->
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<script>
/* =====================================================================
   CONFIG: this is the only section you should need to edit.
   Open the browser console (F12) on first load: the page prints every
   layer in the web map and every field on each table it reads, and
   warns about any HasVacancy value that doesn't match a space type below.
   Add ?debug to the page address (e.g. retail-vacancies.html?debug) to
   also print a report on how broker rows link to vacant spaces.
   ===================================================================== */
const CONFIG = {
  headerNote: 'Questions or updates? Contact Jimmy Salfiti at ' +
    '<a href="mailto:jsalfiti@centercityphila.org">jsalfiti@centercityphila.org</a>.',

  // Shown in a card's details when no broker is listed for a space.
  noBrokerNote: "No broker listed. Email jsalfiti@centercityphila.org for more information.",

  center: [-75.1635, 39.9515],   // [longitude, latitude]
  zoom: 15,

  // ---- Where the data comes from ----
  // The public ArcGIS Online web map. The page draws this web map as-is,
  // so your custom basemap and the SEPTA, housing and district layers
  // keep the styling you gave them there.
  portalUrl: "https://ccdphila.maps.arcgis.com",
  webMapId: "d07ddee9ac7d49fd9f1fcf59d7be7036",

  // Part of the service URL, used to find the right layers in the web map.
  serviceName: "Retail_Vacancies_MIL1",

  // Layer numbers within that service (from its REST page).
  // If a table isn't in the web map, the page looks for it in the same
  // service by number, so you don't have to add tables to the web map.
  // Set businessesLayerId or brokersLayerId to null to skip them.
  propertiesLayerId: 0,
  businessesLayerId: 4,
  brokersLayerId: 5,

  // How often an open page re-reads the data, in minutes, so edits made
  // in ArcGIS Pro appear without a reload. 0 turns this off.
  refreshMinutes: 2,

  // Whether the "Map layers" box starts open. false = collapsed on load.
  // (It always starts collapsed on phones.)
  layersOpen: false,

  // When a property is deselected, go back to the starting map view
  // (center and zoom above) and the top of the list. A property is
  // deselected by clicking "− Hide details", pressing Escape, clicking an
  // empty spot on the map, or clicking its point on the map a second time.
  // false = deselecting leaves the map where it is.
  returnHomeOnDeselect: true,

  // Whether the list scrolls smoothly and the map glides when a property is
  // selected or deselected. false = the list and map jump straight to the
  // new spot with no motion.
  smoothMotion: false,

  // ---- Photos ----
  // Each card shows the first image attached to its property on the
  // properties layer. Or set "field" to the name of a field that holds a
  // photo link, to use that instead of attachments. "thumbWidth" asks the
  // server for a smaller copy (in pixels) so the list loads quickly.
  // enabled: false turns photos off.
  photos: { enabled: true, field: "", thumbWidth: 240 },

  // ---- Properties (the points on the map) ----

  // Which properties to load. A loaded property is shown when its HasVacancy
  // holds a space type, OR when one of its open businesses has a broker
  // (see listedSpacesWhere below), even if its HasVacancy is 'False' or blank.
  where: "Center_City_District = 'Yes'",

  // HasVacancy values that don't count as a space type, whatever their
  // capitalization. Blank values never count either.
  hideSpaceTypes: ["False"],

  fields: {
    address:      "Address",
    neighborhood: "Neighborhood",
    propertyName: "PropertyName",
    spaceType:    "HasVacancy",   // HasVacancy holds the space type
    propertyKey:  "GlobalID"      // what businesses.GUID points to
  },

  // ---- Businesses (vacant spaces inside each property) ----
  // Which business records count as vacant spaces.
  vacantSpacesWhere: "OccupancyStatus = 'Vacant' AND BusinessStatus = 'Active' AND Subtype <> '58'",

  // Spaces that still have a tenant but are on the market (lease ending).
  // A business from this query is listed only while a broker row is linked
  // to it, so deleting the broker row once the space leases removes it.
  // They're listed just like vacant spaces. "" turns this off.
  listedSpacesWhere: "BusinessStatus = 'Active' AND Subtype <> '58' AND " +
    "(OccupancyStatus <> 'Vacant' OR OccupancyStatus IS NULL)",

  // Field names on the businesses table. Set any you don't have to "".
  spaceFields: {
    propertyKey: "GUID",       // alias "Property ID"
    floor:       "Floor"
  },

  // ---- Brokers (contact and size for each vacant space) ----
  // A broker row belongs to a vacant space when
  //   businesses[businessKey] equals brokers[brokerKey].
  brokerLink: { businessKey: "BusinessID", brokerKey: "GUID" },

  // Field names on the broker table. Set any you don't have to "".
  // Use "size" for a single size, or "minSF" and "maxSF" for a range.
  // Each one shows on the card only when it has a value.
  brokerFields: {
    company:      "BrokerageCompany",
    companyPhone: "CompanyPhone",
    companyEmail: "CompanyEmail",
    name:         "Broker",
    phone:        "BrokerPhone",
    email:        "BrokerEmail",
    website:   "Website",
    spaceType: "SpaceType",
    size:      "MaxSize",
    notes:     "Notes"
  },

  // ---- Map layers visitors can turn on and off ----
  // "match" is part of the layer's title in the web map (not case-sensitive).
  // "on" is whether it shows when the page opens.
  overlays: [
    { match: "Transit Lines", label: "Transit Lines", on: false },
    { match: "Recent Completed Multifamily Developments", label: "Recently Completed Multifamily Developments", on: false },
    { match: "Retail Districts", label: "Retail Corridors", on: false },
    { match: "Hotels", label: "Hotels", on: false },
    { match: "Center City District Boundary", label: "Center City District Boundaries", on: true }
  ],

  // ---- Space types ----
  // Each entry is one filter chip and one color. A property's space type
  // comes from its HasVacancy value or, if that's 'False' or blank, from its
  // broker's SpaceType.
  // It first matches a value in "values" (ignoring capitalization, extra
  // spaces, curly apostrophes, "&" vs "and", and "Second Generation" vs
  // "Second-Gen"). If none matches, the first entry with a "keywords" word
  // in the value wins, so new wordings like "Second-Gen Flex/Medical Space"
  // still get the right color. Anything left over goes to the entry named
  // in unknownSpaceType, and is listed in a console warning (F12).
  spaceTypes: [
    { label: "Retail",             color: "#022838",
      values: ["Second Generation Retail Space", "Retail"],
      keywords: ["retail"] },
    { label: "Food & Beverage",    color: "#E98880",
      values: ["Second Generation Food & Beverage Space", "Full Service Restaurant or Bar",
               "Takeout, Coffee Shop, or Quick Service", "Second-Gen Full Service Restaurant or Bar",
               "Second-Gen Takeout, Coffee Shop, or Quick Service"],
      keywords: ["food", "beverage", "restaurant", "bar", "coffee", "cafe", "takeout", "take-out", "quick service"] },
    { label: "Service Provider",   color: "#E15928",
      values: ["Second Generation Service Provider Space", "Service Provider",
               "Fitness, Salon, or Personal Care"],
      keywords: ["service provider", "fitness", "salon", "personal care", "barber", "spa", "gym"] },
    { label: "Flex",               color: "#DFB92A",
      values: ["Second Generation Flex Space", "Flex or Medical Space", "Second-Gen Flex or Medical Space"],
      keywords: ["flex", "medical"] },
    { label: "Space Type Unknown", color: "#007B95",
      values: ["Space Type Unknown"],
      keywords: ["unknown"] },
    { label: "Property For Sale",             color: "#808080",
      values: ["Property For Sale"],
      keywords: ["property"] }
  ],

  // Where properties with no recognizable space type go. "" = gray.
  unknownSpaceType: "Space Type Unknown"
};
/* ===================================================================== */
</script>

<style>
  :root {
    --ink: #1c2a33;
    --muted: #5b6b73;
    --paper: #ffffff;
    --mist: #f2f5f4;
    --line: #dde3e1;
    --field: #c9d2cf;
    --teal: #0f9a8e;
    --teal-ink: #0b6f66;
    --select: #e6f4f2;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--paper);
  }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

  .topbar {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 4px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .topbar h1 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
  .count { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .header-note { margin: 0 0 0 auto; font-size: 0.85rem; color: var(--muted); text-align: right; }
  .header-note a { color: var(--teal-ink); }

  /* The side panel takes about 40% of the width (between 400 and 600px) */
  .layout { display: grid; grid-template-columns: clamp(400px, 40%, 600px) 1fr; min-height: 0; }

  /* The whole panel scrolls as one, so the filters scroll out of the way
     and the property list gets the full height. */
  .panel {
    display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
    border-right: 1px solid var(--line); background: var(--paper);
  }

  /* Filters */
  .filters {
    display: grid; gap: 14px; padding: 16px 20px;
    background: var(--mist); border-bottom: 1px solid var(--line);
  }
  .field > span, .field > legend {
    display: block; margin: 0 0 5px; padding: 0;
    font-size: 0.8rem; font-weight: 600; color: var(--muted);
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  input, select {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--field); border-radius: 6px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 2px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 8px;
    font: inherit; font-size: 0.85rem; color: var(--ink); cursor: pointer;
    background: #fff; border: 1px solid var(--field); border-radius: 999px;
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip[aria-pressed="true"] .n { color: #c3d0cc; }
  .chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px #fff; }

  .size-inputs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .size-inputs span { color: var(--muted); font-size: 0.875rem; }

  .filter-foot { display: flex; justify-content: flex-end; }
  .link-btn {
    padding: 0; font: inherit; font-weight: 600; color: var(--teal-ink); cursor: pointer;
    background: none; border: 0; text-decoration: underline; text-underline-offset: 2px;
  }

  /* List */
  .list { flex: 1 0 auto; margin: 0; padding: 0; list-style: none; }
  .card {
    display: grid; grid-template-columns: 12px 1fr; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .card[aria-current="true"] { background: var(--select); box-shadow: inset 3px 0 0 var(--teal); }
  .card .dot { width: 12px; height: 12px; margin-top: 5px; border-radius: 50%; background: var(--c); }
  .card-main { min-width: 0; }
  .card.has-photo { grid-template-columns: 12px 1fr 96px; }
  .card .thumb {
    width: 96px; height: 72px; overflow: hidden;
    border-radius: 6px; background: var(--mist);
  }
  .card .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .ttl { display: block; font-size: 1rem; font-weight: 600; }
  .card .sub { display: block; margin: 1px 0 0; font-size: 0.875rem; color: var(--muted); }

  /* "+ See details" toggle and the details it reveals */
  .card .more {
    display: inline-block; margin-top: 8px; padding: 0;
    font: inherit; font-size: 0.875rem; font-weight: 600; color: var(--teal-ink);
    cursor: pointer; background: none; border: 0;
  }
  .card .more:hover { text-decoration: underline; text-underline-offset: 2px; }

  .more-body { margin-top: 6px; }
  .more-body dl {
    display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px;
    margin: 0 0 12px; font-size: 0.9rem;
  }
  .more-body dl.contact-block { padding-top: 10px; border-top: 1px solid var(--line); }
  .more-body dt { color: var(--muted); font-size: 0.85rem; }
  .more-body dd { margin: 0; overflow-wrap: anywhere; }
  .more-body a { color: var(--teal-ink); font-weight: 600; }
  .more-body h3 { margin: 14px 0 6px; font-size: 0.9rem; }
  .more-body .no-broker { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }

  .empty { padding: 28px 20px; color: var(--muted); }
  .empty p { margin: 0 0 8px; }

  .map { height: 100%; min-height: 0; }

  /* Layer switches, floating on the map */
  .maplegend {
    width: auto; max-height: calc(100% - 30px); overflow-y: auto;
    font-family: inherit; font-size: 0.78rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 1px 4px rgba(28, 42, 51, 0.18);
  }
  .maplegend summary {
    padding: 9px 12px; font-weight: 600; cursor: pointer; list-style-position: inside;
  }
  .maplegend[open] summary { border-bottom: 1px solid var(--line); }
  .maplegend .sect { padding: 8px 12px; }
  .toggle { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; margin: 0; padding: 0; accent-color: var(--teal); flex: none; }

  @media (max-width: 820px) {
    html, body, .app { height: auto; }
    .layout { grid-template-columns: 1fr; }
    .map { order: -1; height: 46vh; }
    .panel { border-right: 0; overflow: visible; }
    .maplegend { width: 190px; }
  }
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <h1 id="title" hidden></h1>
    <p class="count" id="count" aria-live="polite">Loading spaces…</p>
    <p class="header-note" id="headerNote" hidden></p>
  </header>

  <main class="layout">
    <aside class="panel" id="panel">
      <section class="filters" aria-label="Filter spaces">
        <label class="field">
          <span>Neighborhood</span>
          <select id="hood"><option value="">All neighborhoods</option></select>
        </label>

        <fieldset class="field">
          <legend>Space type</legend>
          <div class="chips" id="types"></div>
        </fieldset>

        <fieldset class="field">
          <legend>Square feet</legend>
          <div class="size-inputs">
            <input id="needMin" type="number" min="0" step="100" inputmode="numeric" placeholder="Min" aria-label="Minimum square feet">
            <span>to</span>
            <input id="needMax" type="number" min="0" step="100" inputmode="numeric" placeholder="Max" aria-label="Maximum square feet">
          </div>
        </fieldset>

        <div class="filter-foot">
          <button class="link-btn" id="reset" type="button">Clear filters</button>
        </div>
      </section>

      <ol class="list" id="list" aria-label="Available spaces"></ol>
    </aside>

    <div class="map" id="map" role="region" aria-label="Map of available spaces"></div>
  </main>
</div>

<!-- Layer switches; moved onto the map at startup -->
<details class="maplegend" id="maplegend" hidden>
  <summary>Map layers</summary>
  <div class="sect" id="overlays"></div>
</details>

<script>
require([
  "esri/config",
  "esri/WebMap",
  "esri/views/MapView",
  "esri/layers/FeatureLayer"
], function (esriConfig, WebMap, MapView, FeatureLayer) {

  // Public page: never show a Portal sign-in window.
  esriConfig.request.useIdentity = false;

  const F = CONFIG.fields, S = CONFIG.spaceFields, B = CONFIG.brokerFields, L = CONFIG.brokerLink;
  // No scroll or map animation when CONFIG.smoothMotion is off, or when the
  // visitor has asked their device for reduced motion.
  const reduceMotion = !CONFIG.smoothMotion ||
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = { animate: !reduceMotion, duration: 600 };
  const scrollBehavior = reduceMotion ? "auto" : "smooth";

  const $ = (id) => document.getElementById(id);
  const els = {
    title: $("title"), count: $("count"), panel: $("panel"), hood: $("hood"),
    types: $("types"), needMin: $("needMin"), needMax: $("needMax"),
    reset: $("reset"), list: $("list"), legend: $("maplegend"), overlays: $("overlays"),
    note: $("headerNote")
  };
  if (CONFIG.title) { els.title.textContent = CONFIG.title; els.title.hidden = false; }
  if (CONFIG.headerNote) { els.note.innerHTML = CONFIG.headerNote; els.note.hidden = false; }

  /* ---------- helpers ---------- */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const str = (v) => (v == null ? "" : String(v).trim());
  const num = (v) => {
    if (v == null || v === "") return null;
    const n = Number(String(v).replace(/,/g, ""));
    return Number.isFinite(n) && n > 0 ? n : null;
  };
  const val = (a, map, key) => (map[key] ? a[map[key]] : null);
  const keyOf = (v) => str(v).replace(/[{}]/g, "").toUpperCase();
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const notNull = (v) => v != null;

  // Gray for any space type that matches no CONFIG.spaceTypes entry.
  const OTHER_COLOR = "#8a9894";

  // Space-type text in a form that ignores capitalization, extra or trailing
  // spaces, curly apostrophes, "&" vs "and", and "Second Generation" vs "Second-Gen".
  const normType = (v) => str(v).toLowerCase()
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/\s*&\s*/g, " and ")
    .replace(/\s+/g, " ").trim()
    .replace(/^second[\s-]*gen(eration)?\b/, "second-gen");

  // HasVacancy values to hide, and a test for whether a value is a space type.
  const HIDE = new Set((CONFIG.hideSpaceTypes || []).map(normType));
  const isShown = (type) => {
    const t = normType(type);
    return t !== "" && !HIDE.has(t);
  };

  // Space-type groups. The map and the list both use groupOf(), so a point
  // and its card always get the same color.
  const reEsc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const TYPES = CONFIG.spaceTypes.map((t) => ({
    ...t,
    values: [].concat(t.values ?? t.value),
    words: [].concat(t.keywords || []).map((k) => new RegExp(`\\b${reEsc(normType(k))}\\b`))
  }));
  const TYPE_BY_VALUE = new Map(TYPES.flatMap((t) => t.values.map((v) => [normType(v), t])));
  // The group for a value: an exact match first, then a keyword match. null if neither.
  const groupOf = (value) => {
    const n = normType(value);
    if (!n) return null;
    return TYPE_BY_VALUE.get(n) || TYPES.find((t) => t.words.some((re) => re.test(n))) || null;
  };
  const UNKNOWN = TYPES.find((t) => t.label === CONFIG.unknownSpaceType) ||
    { label: "Type not listed", color: OTHER_COLOR };
  const typeInfo = (value) => groupOf(value) || UNKNOWN;

  function sizeText(x) {
    if (x.lo == null) return "Size not listed";
    return x.lo === x.hi ? `${fmt(x.lo)} sq ft` : `${fmt(x.lo)} – ${fmt(x.hi)} sq ft`;
  }

  /* ---------- state ---------- */
  const state = { hood: "", types: new Set(), needMin: null, needMax: null };
  let records = [], filtered = [], byId = new Map();
  let layerView = null, highlight = null, selectedId = null;
  // Properties whose details are open. Kept across filter changes and data refreshes.
  const expanded = new Set();
  let layer = null, spacesTable = null, brokersTable = null;
  let lastLoad = 0, refreshing = false;

  /* ---------- map ---------- */
  // The web map supplies the basemap and the overlay layers, styled as in ArcGIS Online.
  const webMap = new WebMap({ portalItem: { id: CONFIG.webMapId, portal: { url: CONFIG.portalUrl } } });

  const view = new MapView({
    container: "map",
    map: webMap,
    center: CONFIG.center,
    zoom: CONFIG.zoom,
    constraints: { minZoom: 11 },
    popupEnabled: false
  });

  const marker = (color) =>
    ({ type: "simple-marker", size: 10, color, outline: { color: "#fff", width: 1.2 } });

  // Gives every listed property its own symbol in its space type's color,
  // worked out here with the same matching as the list. This way the map
  // can't disagree with the list, whatever the raw field values look like.
  let rendererKey = "";
  function updateRenderer() {
    if (!layer) return;
    const infos = records.map((r) => {
      const t = typeInfo(r.type);
      return { value: r.id, label: t.label, color: t.color };
    });
    const key = JSON.stringify(infos.map((i) => [i.value, i.color]));
    if (key === rendererKey) return;
    rendererKey = key;

    layer.renderer = {
      type: "unique-value",
      field: layer.objectIdField,
      defaultSymbol: marker(OTHER_COLOR),
      uniqueValueInfos: infos.map((i) => ({ value: i.value, label: i.label, symbol: marker(i.color) }))
    };

    // Every space type value and the group it landed in.
    const seen = new Map();
    records.forEach((r) => {
      const k = r.type || "(blank)";
      const row = seen.get(k) || { value: k, group: typeInfo(r.type).label,
        matched: groupOf(r.type) ? "yes" : "NO", properties: 0 };
      row.properties++;
      seen.set(k, row);
    });
    const unmatched = [...seen.values()].filter((row) => row.matched === "NO");
    if (unmatched.length) {
      console.warn(`Space type values that match no CONFIG.spaceTypes entry (shown as "${UNKNOWN.label}"). ` +
        "Add each one to the right entry's values list:");
      console.table(unmatched);
    }
    if (DEBUG) {
      console.info("Every space type value and its group:");
      console.table([...seen.values()]);
    }
  }

  // Finds the properties, businesses and broker layers in the web map, and
  // hides the web map's own copy of the vacancy points (this page draws its own).
  function findDataLayers() {
    const tables = (webMap.allTables || webMap.tables).toArray();
    const all = webMap.allLayers.toArray().concat(tables).filter((l) => l.url);
    console.info("Layers in the web map:");
    console.table(all.map((l) => ({ title: l.title, url: l.url, layerId: l.layerId })));

    const fromService = all.filter((l) => l.url.includes(CONFIG.serviceName));
    fromService.forEach((l) => { if ("visible" in l) l.visible = false; });

    const find = (id) => (id == null ? null : fromService.find((l) => Number(l.layerId) === Number(id)));
    return {
      props: find(CONFIG.propertiesLayerId),
      spaces: find(CONFIG.businessesLayerId),
      brokers: find(CONFIG.brokersLayerId),
      hidden: new Set(fromService)
    };
  }

  // A table from the web map, or the same service by layer number if it isn't there.
  function tableLayer(found, propsLayer, id) {
    if (id == null) return null;
    const src = found || propsLayer;
    return new FeatureLayer({ url: src.url, layerId: found ? found.layerId : id, outFields: ["*"] });
  }

  // Warns in the console (once per table) about configured field names it doesn't have.
  const checked = new Set();
  function checkFields(lyr, map, label) {
    if (!lyr || !lyr.loaded || checked.has(label)) return;
    checked.add(label);
    const names = new Set((lyr.fields || []).map((f) => f.name));
    console.info(`Fields on ${label}:`, [...names].join(", "));
    const missing = Object.entries(map).filter(([, f]) => f && !names.has(f));
    if (missing.length) {
      console.warn(`${label}: these configured fields don't exist: ` +
        missing.map(([k, f]) => `${k} → "${f}"`).join(", "));
    }
  }

  // Loads every matching row, a page at a time.
  async function loadAll(lyr, { where, geometry } = {}) {
    await lyr.load();
    const caps = lyr.capabilities && lyr.capabilities.query;
    const paging = !!(caps && caps.supportsPagination);
    const pageSize = (caps && caps.maxRecordCount) || 1000;
    const all = [];
    let start = 0;
    while (true) {
      const q = lyr.createQuery();
      // createQuery() already carries the layer's filter (CONFIG.where for the
      // properties), so only replace it when a different filter is passed in.
      if (where) q.where = where;
      if (!q.where) q.where = "1=1";
      q.outFields = ["*"];
      q.returnGeometry = !!geometry;
      if (geometry) q.outSpatialReference = view.spatialReference;
      if (paging) { q.start = start; q.num = pageSize; }
      const fs = await lyr.queryFeatures(q);
      all.push(...fs.features);
      if (!paging || !fs.exceededTransferLimit || fs.features.length === 0) break;
      start += fs.features.length;
    }
    return all;
  }

  // Loads a table, or returns no rows (with a console warning) if it fails.
  const loadOrEmpty = (lyr, opts, warning) => (lyr
    ? loadAll(lyr, opts).catch((err) => { console.warn(warning, err); return []; })
    : Promise.resolve([]));

  // A property's space type as text. If HasVacancy has a coded-value domain
  // (including one that differs by subtype), this is the domain's description,
  // not the stored code.
  function spaceTypeOf(g) {
    const raw = val(g.attributes, F, "spaceType");
    const d = layer && layer.getFieldDomain ? layer.getFieldDomain(F.spaceType, { feature: g }) : null;
    if (d && d.type === "coded-value") {
      const c = d.codedValues.find((cv) => String(cv.code) === String(raw));
      if (c) return str(c.name);
    }
    return str(raw);
  }

  // Accepts "www.example.com" as well as full links.
  function websiteUrl(v) {
    if (!v) return "";
    if (/^https?:\/\//i.test(v)) return v;
    return /^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v) ? `https://${v}` : "";
  }

  function toBroker(a) {
    const size = num(val(a, B, "size"));
    return {
      name: str(val(a, B, "name")),
      company: str(val(a, B, "company")),
      companyPhone: str(val(a, B, "companyPhone")),
      companyEmail: str(val(a, B, "companyEmail")),
      phone: str(val(a, B, "phone")),
      email: str(val(a, B, "email")),
      url: websiteUrl(str(val(a, B, "website"))),
      spaceType: str(val(a, B, "spaceType")),
      notes: str(val(a, B, "notes")),
      lo: num(val(a, B, "minSF")) ?? size,
      hi: num(val(a, B, "maxSF")) ?? size
    };
  }

  const hasContent = (b) => b.name || b.company || b.companyPhone || b.companyEmail ||
    b.phone || b.email || b.url || b.spaceType || b.notes;

  // Lowest and highest size across a list of things with lo/hi.
  function range(items) {
    const los = items.map((x) => x.lo ?? x.hi).filter(notNull);
    const his = items.map((x) => x.hi ?? x.lo).filter(notNull);
    let lo = los.length ? Math.min(...los) : null;
    let hi = his.length ? Math.max(...his) : null;
    if (lo != null && hi != null && lo > hi) [lo, hi] = [hi, lo];
    return { lo, hi };
  }

  function toSpace(a, brokers) {
    // Size comes from the broker table only.
    return { floor: str(val(a, S, "floor")), ...range(brokers), brokers: brokers.filter(hasContent) };
  }

  function toRecord(g, spaces) {
    const a = g.attributes;
    const id = a[layer.objectIdField];
    // The property's own space type, or failing that, its brokers'. The first
    // one that matches a group wins.
    const ownType = spaceTypeOf(g);
    const candidates = [isShown(ownType) ? ownType : ""]
      .concat(spaces.flatMap((sp) => sp.brokers).map((b) => b.spaceType))
      .filter(Boolean);
    return {
      id,
      key: keyOf(val(a, F, "propertyKey")),
      // From the photo field if one is set, else the attachment found last time.
      photo: P.field ? websiteUrl(str(a[P.field])) : (photoById.get(id) || ""),
      geometry: g.geometry,
      address: str(val(a, F, "address")) || "Address not listed",
      propertyName: str(val(a, F, "propertyName")),
      hood: str(val(a, F, "neighborhood")),
      type: candidates.find((c) => groupOf(c)) || candidates[0] || "",
      spaces,
      ...range(spaces)
    };
  }

  // Reads all three tables and joins them: property → listed spaces → brokers.
  // A listed space is either vacant, or still occupied but with a broker attached.
  async function fetchRecords() {
    const [props, spaceRows, listedRows, brokerRows] = await Promise.all([
      loadAll(layer, { geometry: true }),
      loadOrEmpty(spacesTable, { where: CONFIG.vacantSpacesWhere },
        "Vacant spaces couldn't be loaded. Check CONFIG.businessesLayerId and CONFIG.vacantSpacesWhere."),
      CONFIG.listedSpacesWhere
        ? loadOrEmpty(spacesTable, { where: CONFIG.listedSpacesWhere },
            "Spaces with ending leases couldn't be loaded. Check CONFIG.listedSpacesWhere.")
        : Promise.resolve([]),
      loadOrEmpty(brokersTable, {},
        "Brokers couldn't be loaded. Check CONFIG.brokersLayerId and that the broker table is shared publicly.")
    ]);

    checkFields(layer, F, "properties");
    checkFields(spacesTable, { link: L.businessKey, ...S }, "businesses");
    checkFields(brokersTable, { link: L.brokerKey, ...B }, "brokers");

    const brokersBySpace = new Map();
    brokerRows.forEach((g) => {
      const k = keyOf(g.attributes[L.brokerKey]);
      if (!k) return;
      if (!brokersBySpace.has(k)) brokersBySpace.set(k, []);
      brokersBySpace.get(k).push(toBroker(g.attributes));
    });
    const brokersFor = (a) => brokersBySpace.get(keyOf(a[L.businessKey])) || [];

    // Vacant spaces always; occupied ones only while a broker row is linked.
    const vacantKeys = new Set(spaceRows.map((g) => keyOf(g.attributes[L.businessKey])));
    const withBroker = new Set();   // properties with an occupied space on the market
    const listed = spaceRows.map((g) => g.attributes).concat(
      listedRows.map((g) => g.attributes).filter((a) => {
        const k = keyOf(a[L.businessKey]);
        const ok = k && !vacantKeys.has(k) && brokersFor(a).some(hasContent);
        if (ok) withBroker.add(keyOf(val(a, S, "propertyKey")));
        return ok;
      }));

    const spacesByProperty = new Map();
    listed.forEach((a) => {
      const k = keyOf(val(a, S, "propertyKey"));
      if (!k) return;
      if (!spacesByProperty.has(k)) spacesByProperty.set(k, []);
      spacesByProperty.get(k).push(toSpace(a, brokersFor(a)));
    });

    if (brokerRows.length && listed.length &&
        ![...spacesByProperty.values()].some((list) => list.some((sp) => sp.brokers.length))) {
      console.warn("Brokers loaded but none matched a listed space. Check CONFIG.brokerLink.");
    }

    // Shown if HasVacancy holds a space type, or if an open business there has a broker.
    const out = props.map((g) => {
      const k = keyOf(val(g.attributes, F, "propertyKey"));
      const show = isShown(spaceTypeOf(g)) || withBroker.has(k);
      return show ? toRecord(g, spacesByProperty.get(k) || []) : null;
    }).filter(Boolean);

    if (DEBUG) {
      const listedKeys = new Set(listed.map((a) => keyOf(a[L.businessKey])));
      diagnoseBrokers(props, listedKeys, brokerRows, new Set(out.map((r) => r.key)))
        .catch((err) => console.warn("Broker link report failed.", err));
    }
    return out;
  }

  /* ---------- photos (attachments on the properties layer) ---------- */
  const P = CONFIG.photos || {};
  let photoById = new Map();   // property ID → photo URL, kept across refreshes
  let photoNoteShown = false;

  const isImage = (a) =>
    /^image\//i.test(a.contentType || "") || /\.(jpe?g|png|gif|webp)$/i.test(a.name || "");

  // Finds the first image attached to each listed property, then redraws the
  // list if any photo changed. Runs after the list is shown, so it never
  // holds up the page.
  async function loadPhotos() {
    if (!P.enabled || P.field || !layer || !records.length) return;
    const caps = layer.capabilities || {};
    if (!(caps.data && caps.data.supportsAttachment)) {
      if (!photoNoteShown) {
        console.info("The properties layer has no attachments, so no photos are shown. " +
          "Turn on attachments for that layer, or set CONFIG.photos.field to a field with photo links.");
        photoNoteShown = true;
      }
      return;
    }
    const resize = !!(caps.attachment && caps.attachment.supportsResize) && Number(P.thumbWidth) > 0;
    const sized = (url) => (resize ? `${url}${url.includes("?") ? "&" : "?"}w=${Number(P.thumbWidth)}` : url);

    const ids = records.map((r) => r.id);
    const next = new Map();
    for (let i = 0; i < ids.length; i += 100) {
      const chunk = ids.slice(i, i + 100);
      try {
        const res = await layer.queryAttachments({ objectIds: chunk });
        Object.entries(res).forEach(([oid, infos]) => {
          const img = (infos || []).find(isImage);
          if (img) next.set(Number(oid), sized(img.url));
        });
      } catch (err) {
        // Keep the photos we already had for this batch.
        chunk.forEach((id) => { if (photoById.has(id)) next.set(id, photoById.get(id)); });
        console.warn("Some photos couldn't be loaded.", err);
      }
    }
    photoById = next;

    let changed = false;
    records.forEach((r) => {
      const p = next.get(r.id) || "";
      if (p !== r.photo) { r.photo = p; changed = true; }
    });
    if (changed) renderList();
  }

  /* ---------- broker link report (?debug) ---------- */
  // Explains, in the console, why broker rows do or don't reach a property.
  // Only runs once, and only when the page address contains ?debug.
  const DEBUG = /[?&]debug\b/i.test(location.search);
  let diagnosed = false;

  async function diagnoseBrokers(props, listedKeys, brokerRows, shownProps) {
    if (diagnosed || !spacesTable || !brokersTable) return;
    diagnosed = true;
    const bizKey = L.businessKey, brkKey = L.brokerKey;

    // Every business row, not just the vacant ones, to see what brokers point at.
    const allBiz = await loadAll(spacesTable, { where: "1=1" });
    const filters = `${CONFIG.vacantSpacesWhere} ${CONFIG.listedSpacesWhere || ""}`;
    const statusFields = [...new Set([...filters.matchAll(/([A-Za-z_]\w*)\s*(?:=|<>|!=|\bIN\b|\bLIKE\b)/gi)]
      .map((m) => m[1]))];

    const bizByKey = new Map(allBiz.map((g) => [keyOf(g.attributes[bizKey]), g.attributes]));
    const propKey = (g) => keyOf(val(g.attributes, F, "propertyKey"));
    const allProps = new Set(props.map(propKey));

    const tally = {
      "Shown on the map": 0,
      "Linked to a listed space, but its property is filtered out": 0,
      "Linked to a business left out by the space filters": 0,
      "Key matches a PROPERTY's GlobalID, not a business": 0,
      "Key matches nothing": 0,
      "Key is blank": 0
    };
    const excludedStatuses = new Map();
    const examples = [];

    brokerRows.forEach((g) => {
      const a = g.attributes;
      const k = keyOf(a[brkKey]);
      const who = str(val(a, B, "name")) || str(val(a, B, "company")) || `OBJECTID ${a[brokersTable.objectIdField]}`;
      let why;
      if (!k) why = "Key is blank";
      else if (listedKeys.has(k)) {
        const prop = keyOf(val(bizByKey.get(k) || {}, S, "propertyKey"));
        why = shownProps.has(prop) ? "Shown on the map"
          : "Linked to a listed space, but its property is filtered out";
      } else if (bizByKey.has(k)) {
        why = "Linked to a business left out by the space filters";
        const b = bizByKey.get(k);
        const combo = statusFields.map((f) => `${f} = ${b[f] == null ? "(blank)" : `'${b[f]}'`}`).join(", ") || "(see table)";
        excludedStatuses.set(combo, (excludedStatuses.get(combo) || 0) + 1);
      } else if (allProps.has(k)) why = "Key matches a PROPERTY's GlobalID, not a business";
      else why = "Key matches nothing";
      tally[why]++;
      if (why !== "Shown on the map" && examples.length < 15) examples.push({ broker: who, [brkKey]: a[brkKey], problem: why });
    });

    console.group(`Broker link report: ${brokerRows.length} broker rows, ` +
      `${allBiz.length} business rows (${listedKeys.size} listed)`);
    console.info(`Link used: businesses.${bizKey} = brokers.${brkKey}`);
    console.table(tally);
    if (excludedStatuses.size) {
      console.info("Businesses that have brokers but are left out by CONFIG.vacantSpacesWhere " +
        "and CONFIG.listedSpacesWhere:");
      console.table([...excludedStatuses].map(([values, brokers]) => ({ values, brokers })));
    }
    if (examples.length) {
      console.info("Examples of brokers that don't show:");
      console.table(examples);
    }
    console.groupEnd();
  }

  /* ---------- legend & overlays ---------- */
  const overlayLayers = [];

  function setLayerVisible(lyr, on) {
    lyr.visible = on;
    if (!on) return;
    // A layer inside a hidden group layer won't draw, so show its groups too.
    for (let p = lyr.parent; p && p.type === "group"; p = p.parent) p.visible = true;
  }

  function setupOverlays(hidden) {
    // Skip basemap layers and this service's layers when matching titles.
    const bm = webMap.basemap;
    const base = new Set(bm ? bm.baseLayers.toArray().concat(bm.referenceLayers.toArray()) : []);
    const candidates = webMap.allLayers.toArray()
      .filter((l) => !base.has(l) && !hidden.has(l) && l !== layer);

    const rows = [];
    (CONFIG.overlays || []).forEach((o, i) => {
      const m = str(o.match).toLowerCase();
      const lyr = m && candidates.find((l) => str(l.title).toLowerCase().includes(m));
      if (!lyr) {
        console.warn(`No layer in the web map has "${o.match}" in its title, so the ` +
          `"${o.label}" switch is left out. See the layer table above.`);
        return;
      }
      overlayLayers[i] = lyr;
      setLayerVisible(lyr, !!o.on);
      rows.push(`<label class="toggle"><input type="checkbox" data-i="${i}" ${o.on ? "checked" : ""}>
        ${esc(o.label)}</label>`);
    });

    els.overlays.innerHTML = rows.join("");
    els.legend.hidden = rows.length === 0;
  }

  els.overlays.addEventListener("change", (e) => {
    const box = e.target.closest("input[data-i]");
    const lyr = box && overlayLayers[Number(box.dataset.i)];
    if (lyr) setLayerVisible(lyr, box.checked);
  });

  /* ---------- filters ---------- */
  function buildFilterOptions() {
    // Neighborhood dropdown: names only, sorted A–Z.
    const hoods = [...new Set(records.map((r) => r.hood).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
    els.hood.length = 1;   // keep "All neighborhoods"
    hoods.forEach((h) => els.hood.add(new Option(h, h)));
    if (state.hood && !hoods.includes(state.hood)) state.hood = "";
    els.hood.value = state.hood;

    // One chip per space-type group, counted by group, in CONFIG order.
    const counts = new Map();
    records.forEach((r) => {
      const k = typeInfo(r.type).label;
      counts.set(k, (counts.get(k) || 0) + 1);
    });
    const ordered = [...new Set(TYPES.map((t) => t.label))].filter((k) => counts.has(k));
    counts.forEach((_, k) => { if (!ordered.includes(k)) ordered.push(k); });
    state.types.forEach((k) => { if (!counts.has(k)) state.types.delete(k); });

    els.types.innerHTML = ordered.map((k) => {
      const t = TYPES.find((x) => x.label === k) || typeInfo(k);
      return `<button type="button" class="chip" aria-pressed="${state.types.has(k)}" data-type="${esc(k)}" style="--c:${t.color}">
        <span class="dot"></span>${esc(t.label)} <span class="n">${counts.get(k)}</span></button>`;
    }).join("");
  }

  const fits = (x) =>
    x.lo != null &&
    (state.needMin == null || x.hi >= state.needMin) &&
    (state.needMax == null || x.lo <= state.needMax);

  function matches(r) {
    if (state.hood && r.hood !== state.hood) return false;
    if (state.types.size && !state.types.has(typeInfo(r.type).label)) return false;
    if (state.needMin != null || state.needMax != null) {
      // A property fits if any of its vacant spaces overlaps the size range needed.
      if (r.spaces.length ? !r.spaces.some(fits) : !fits(r)) return false;
    }
    return true;
  }

  // Largest spaces first; spaces without a size go last; ties by address.
  const bySize = (a, b) => ((b.hi ?? -1) - (a.hi ?? -1)) ||
    a.address.localeCompare(b.address, "en", { numeric: true });

  function apply() {
    filtered = records.filter(matches).sort(bySize);
    renderCount();
    renderList();
    syncMap();
  }

  function renderCount() {
    const n = filtered.length, total = records.length;
    els.count.textContent = n === total
      ? `${total} ${total === 1 ? "property" : "properties"} with available space`
      : `Showing ${n} of ${total} properties`;
  }

  /* ---------- cards with "+ See details" ---------- */
  const SHOW_LABEL = "+ See details";
  const HIDE_LABEL = "− Hide details";
  const NO_BROKER = `<p class="no-broker">${esc(CONFIG.noBrokerNote)}</p>`;

  const dlHtml = (rows, cls = "") =>
    `<dl${cls ? ` class="${cls}"` : ""}>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;

  function brokerHtml(b) {
    const rows = [];
    if (b.company) rows.push(["Company", esc(b.company)]);
    if (b.companyPhone) rows.push(["Company phone", esc(b.companyPhone)]);
    if (b.companyEmail) rows.push(["Company email", esc(b.companyEmail)]);
    if (b.name) rows.push(["Broker", esc(b.name)]);
    if (b.phone) rows.push(["Broker phone", esc(b.phone)]);
    if (b.email) rows.push(["Broker email", esc(b.email)]);
    if (b.spaceType) rows.push(["Space type", esc(b.spaceType)]);
    if (b.url) {
      rows.push(["Website", `<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.url.replace(/^https?:\/\//i, "").replace(/\/$/, ""))}</a>`]);
    }
    if (b.notes) rows.push(["Notes", esc(b.notes)]);
    return dlHtml(rows, "contact-block");
  }

  function spaceHtml(sp, i, total) {
    const rows = [];
    if (sp.floor) rows.push(["Floor", esc(sp.floor)]);
    rows.push(["Size", esc(sizeText(sp))]);
    // A heading only when a property has more than one vacant space.
    const heading = total > 1 ? `<h3>Space ${i + 1}</h3>` : "";
    return heading + dlHtml(rows) + (sp.brokers.length ? sp.brokers.map(brokerHtml).join("") : NO_BROKER);
  }

  const detailsHtml = (r) => (r.spaces.length
    ? r.spaces.map((sp, i) => spaceHtml(sp, i, r.spaces.length)).join("")
    : NO_BROKER);

  function cardHtml(r) {
    const t = typeInfo(r.type);
    const sub = [r.propertyName, r.hood].filter(Boolean).join(", ");
    const open = expanded.has(r.id);
    const bodyId = `details-${esc(r.id)}`;
    const thumb = r.photo
      ? `<span class="thumb"><img src="${esc(r.photo)}" alt="" loading="lazy" decoding="async"></span>`
      : "";
    return `<article class="card${r.photo ? " has-photo" : ""}" data-id="${esc(r.id)}" style="--c:${t.color}"
        aria-current="${r.id === selectedId}">
      <span class="dot" aria-hidden="true"></span>
      <div class="card-main">
        <span class="ttl">${esc(r.address)}</span>
        ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
        <button type="button" class="more" aria-expanded="${open}" aria-controls="${bodyId}">${open ? HIDE_LABEL : SHOW_LABEL}</button>
        <div class="more-body" id="${bodyId}" ${open ? "" : "hidden"}>${detailsHtml(r)}</div>
      </div>
      ${thumb}
    </article>`;
  }

  const cardEl = (id) => els.list.querySelector(`.card[data-id="${CSS.escape(String(id))}"]`);

  function renderList() {
    // Keep keyboard focus on the same toggle when the list is redrawn.
    const active = document.activeElement;
    const focusId = active && els.list.contains(active) && active.classList.contains("more")
      ? active.closest(".card").dataset.id : null;

    if (!filtered.length) {
      els.list.innerHTML = `<li class="empty"><p>No properties match these filters.</p>
        <button type="button" class="link-btn" data-action="reset">Clear filters</button></li>`;
      return;
    }
    els.list.innerHTML = filtered.map((r) => `<li>${cardHtml(r)}</li>`).join("");

    const card = focusId != null && cardEl(focusId);
    if (card) card.querySelector(".more").focus({ preventScroll: true });
  }

  function syncMap() {
    if (!layerView) return;
    // Always filter by ID, so the map shows exactly the properties in the list.
    layerView.filter = filtered.length ? { objectIds: filtered.map((r) => r.id) } : { where: "1=0" };
  }

  function zoomToFiltered() {
    if (!filtered.length) return;
    view.goTo(filtered.map((r) => r.geometry), motion)
      .then(() => { if (view.zoom > 17) view.zoom = 17; })
      .catch(() => {});
  }

  function resetFilters() {
    Object.assign(state, { hood: "", needMin: null, needMax: null });
    state.types.clear();
    els.hood.value = ""; els.needMin.value = ""; els.needMax.value = "";
    els.types.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
    apply();
  }

  /* ---------- selection & expanding details ---------- */
  function setHighlight(id) {
    if (highlight) { highlight.remove(); highlight = null; }
    if (layerView && id != null) highlight = layerView.highlight(id);
  }

  // Marks one property as current: highlighted on the map and in the list.
  function setSelected(id) {
    selectedId = id;
    setHighlight(id);
    const sel = String(id);
    els.list.querySelectorAll(".card").forEach((c) =>
      c.setAttribute("aria-current", String(id != null && c.dataset.id === sel)));
  }

  // Back to how the page looked on load: the starting map view, top of the list.
  function goHome() {
    view.goTo({ center: CONFIG.center, zoom: CONFIG.zoom }, motion).catch(() => {});
    els.panel.scrollTo({ top: 0, behavior: scrollBehavior });
    window.scrollTo({ top: 0, behavior: scrollBehavior });   // phones, where the whole page scrolls
  }

  function deselect() {
    if (selectedId == null) return;
    setSelected(null);
    if (CONFIG.returnHomeOnDeselect) goHome();
  }

  // Opens or closes a card's details in place, without leaving the list.
  function toggleDetails(id, { open = !expanded.has(id), zoom = false, scroll = false } = {}) {
    open ? expanded.add(id) : expanded.delete(id);
    const r = byId.get(id);
    const card = cardEl(id);

    if (card) {
      const btn = card.querySelector(".more");
      btn.setAttribute("aria-expanded", String(open));
      btn.textContent = open ? HIDE_LABEL : SHOW_LABEL;
      card.querySelector(".more-body").hidden = !open;
    }

    if (!open) { if (selectedId === id) deselect(); return; }
    if (!r || !card) return;
    setSelected(id);
    if (zoom) view.goTo({ target: r.geometry, zoom: Math.max(view.zoom, 17) }, motion).catch(() => {});
    if (scroll) card.scrollIntoView({ behavior: scrollBehavior, block: "start" });
  }

  /* ---------- loading & live refresh ---------- */
  async function load() {
    records = await fetchRecords();
    byId = new Map(records.map((r) => [r.id, r]));
    lastLoad = Date.now();
  }

  async function refresh() {
    if (refreshing || !layer) return;
    refreshing = true;
    try {
      await load();
      updateRenderer();
      // Forget open cards for properties that are no longer listed.
      expanded.forEach((id) => { if (!byId.has(id)) expanded.delete(id); });
      if (selectedId != null && !byId.has(selectedId)) selectedId = null;
      buildFilterOptions();
      apply();
      layer.refresh();
      setHighlight(selectedId);
      loadPhotos().catch((err) => console.warn("Photos couldn't be refreshed.", err));
    } catch (err) {
      console.warn("Couldn't refresh listings; keeping the current ones.", err);
    } finally {
      refreshing = false;
    }
  }

  function startAutoRefresh() {
    const ms = (Number(CONFIG.refreshMinutes) || 0) * 60000;
    if (!ms) return;
    setInterval(() => { if (!document.hidden) refresh(); }, ms);
    // A tab left in the background catches up as soon as someone returns to it.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Date.now() - lastLoad > ms) refresh();
    });
  }

  /* ---------- events ---------- */
  function debounce(fn, ms) {
    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  els.hood.addEventListener("change", () => {
    state.hood = els.hood.value; apply(); zoomToFiltered();
  });

  const readSize = debounce(() => {
    let a = num(els.needMin.value), b = num(els.needMax.value);
    if (a != null && b != null && a > b) [a, b] = [b, a];
    state.needMin = a; state.needMax = b; apply();
  }, 300);
  els.needMin.addEventListener("input", readSize);
  els.needMax.addEventListener("input", readSize);

  els.types.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const v = chip.dataset.type;
    const on = chip.getAttribute("aria-pressed") !== "true";
    chip.setAttribute("aria-pressed", String(on));
    on ? state.types.add(v) : state.types.delete(v);
    apply();
  });

  els.reset.addEventListener("click", resetFilters);

  // Only the "+ See details" button opens a card; the rest of the card is plain text,
  // so visitors can select and copy phone numbers and emails.
  els.list.addEventListener("click", (e) => {
    if (e.target.closest('[data-action="reset"]')) { resetFilters(); return; }
    const btn = e.target.closest(".more");
    if (btn) toggleDetails(Number(btn.closest(".card").dataset.id), { zoom: true });
  });

  const focusToggle = (id) => {
    const c = cardEl(id);
    if (c) c.querySelector(".more").focus({ preventScroll: true });
  };

  // Escape closes the details of the card that has focus (or the current one).
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const card = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest(".card") : null;
    const id = card ? Number(card.dataset.id) : selectedId;
    if (id == null || !expanded.has(id)) return;
    toggleDetails(id, { open: false });
    focusToggle(id);
  });

  // The vacancy point under the pointer, if any.
  async function pointAt(e) {
    const res = await view.hitTest(e, { include: [layer] });
    return res.results.find((h) => h.graphic && h.graphic.layer === layer);
  }

  // Clicking a point on the map opens that property's details in the list.
  // Clicking empty map, or the selected point again, deselects it.
  view.on("click", async (e) => {
    if (!layer) return;
    const hit = await pointAt(e);
    const id = hit ? hit.graphic.attributes[layer.objectIdField] : null;
    if (id == null || id === selectedId) {
      if (selectedId != null) toggleDetails(selectedId, { open: false });
      return;
    }
    toggleDetails(id, { open: true, scroll: true });
    focusToggle(id);
  });

  view.on("pointer-move", debounce(async (e) => {
    if (!layer) return;
    view.container.style.cursor = (await pointAt(e)) ? "pointer" : "";
  }, 30));

  /* ---------- start ---------- */
  (async function start() {
    try {
      els.legend.open = !!CONFIG.layersOpen && !window.matchMedia("(max-width: 820px)").matches;
      view.ui.add(els.legend, "top-right");

      await view.when();

      const found = findDataLayers();
      if (!found.props) {
        throw new Error(`No layer ${CONFIG.propertiesLayerId} from ${CONFIG.serviceName} in the web map. ` +
          "See the table above for the layers it contains.");
      }

      layer = new FeatureLayer({
        url: found.props.url,
        layerId: found.props.layerId,
        outFields: ["*"],
        definitionExpression: CONFIG.where || null,
        popupEnabled: false,
        // Hidden until the data loads, so properties that won't be listed
        // never flash on the map.
        opacity: 0,
        renderer: { type: "simple", symbol: marker(OTHER_COLOR) }
      });
      view.map.add(layer);

      spacesTable = tableLayer(found.spaces, found.props, CONFIG.businessesLayerId);
      brokersTable = spacesTable ? tableLayer(found.brokers, found.props, CONFIG.brokersLayerId) : null;

      setupOverlays(found.hidden);

      // Load the data and the map layer at the same time.
      [layerView] = await Promise.all([view.whenLayerView(layer), load()]);
      updateRenderer();
      buildFilterOptions();
      apply();
      layer.opacity = 1;
      loadPhotos().catch((err) => console.warn("Photos couldn't be loaded.", err));
      startAutoRefresh();
    } catch (err) {
      console.error(err);
      console.warn("Listings failed to load. Check CONFIG.webMapId, CONFIG.propertiesLayerId and the field names " +
        "in CONFIG.where.");
      els.count.textContent = "Listings unavailable";
      els.list.innerHTML = `<li class="empty"><p>Listings are temporarily unavailable.</p>
        <p>Please check back soon.</p></li>`;
    }
  })();
});
</script>
</body>
</html>
